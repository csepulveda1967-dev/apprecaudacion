<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Inventario - Inicio de Sesión</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #0f172a;
  --muted: #64748b;
  --primary-bar: #1b4f72;
  --primary-admin: #512e5f;
  --border: #e2e8f0;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
  padding: 20px;
}
.login-card {
  background: white; border: 1px solid var(--border); border-radius: 18px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06); width: 100%; max-width: 440px; padding: 36px 30px;
}
.login-header { text-align: center; margin-bottom: 26px; }
.login-header h1 { margin: 0 0 8px 0; font-size: 22px; color: #0f172a; }
.login-header p { margin: 0; color: var(--muted); font-size: 13px; }

.roles-info {
  background: #f1f5f9; border-radius: 10px; padding: 12px; margin-bottom: 20px; font-size: 12px;
}
.role-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 11px; }
.role-admin { background: #f3e8ff; color: #7e22ce; }
.role-bar { background: #e0f2fe; color: #0369a1; }

label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #334155; }
input {
  width: 100%; padding: 11px 13px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 14px; margin-bottom: 16px; background: #fdfdfd;
}
input:focus { outline: 2px solid #3b82f6; border-color: transparent; }

.btn {
  width: 100%; background: #0f172a; color: white; border: none; padding: 13px;
  border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
}
.btn:hover { opacity: 0.92; }

.quick-select {
  display: flex; gap: 8px; margin-bottom: 18px;
}
.quick-btn {
  flex: 1; padding: 8px 6px; font-size: 11px; border: 1px dashed #cbd5e1;
  background: white; border-radius: 6px; cursor: pointer; text-align: center; color: #475569;
}
.quick-btn:hover { background: #f8fafc; border-color: #94a3b8; }

#errorMsg {
  background: #fef2f2; border: 1px solid #fecaca; color: #dc2626;
  padding: 10px; border-radius: 6px; font-size: 12px; margin-bottom: 16px; display: none;
}
.config-link {
  text-align: center; margin-top: 18px; font-size: 12px;
}
.config-link a { color: #64748b; text-decoration: none; cursor: pointer; }
.config-link a:hover { text-decoration: underline; }

#supabaseConfigBox {
  margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--border); display: none;
}
</style>
</head>
<body>

<div class="login-card">
  <div class="login-header">
    <h1>Control de Inventario Gastronómico</h1>
    <p>Ingreso seguro con roles de usuario (Supabase Auth)</p>
  </div>

  <div class="roles-info">
    <div style="margin-bottom:6px;">
      <span class="role-badge role-admin">ADMIN</span> <b>asesorconsultorcasf@yahoo.com</b>
      <div style="color:var(--muted); font-size:11px;">Acceso completo a Gerencia, Costos y Bar.</div>
    </div>
    <div>
      <span class="role-badge role-bar">BAR</span> <b>csepulvedafuica@gmail.com</b>
      <div style="color:var(--muted); font-size:11px;">Restringido a Turnos y Pedidos de Barra.</div>
    </div>
  </div>

  <div class="quick-select">
    <button class="quick-btn" type="button" onclick="seleccionarUsuario('asesorconsultorcasf@yahoo.com')">👤 Cargar Yahoo (Admin)</button>
    <button class="quick-btn" type="button" onclick="seleccionarUsuario('csepulvedafuica@gmail.com')">🍸 Cargar Gmail (Bar)</button>
  </div>

  <form id="loginForm" onsubmit="iniciarSesion(event)">
    <label>Correo Electrónico</label>
    <input type="email" id="email" required placeholder="tu-correo@dominio.com">

    <label>Contraseña</label>
    <input type="password" id="password" required placeholder="••••••••">

    <div id="errorMsg"></div>

    <button type="submit" class="btn" id="btnSubmit">Iniciar Sesión →</button>
  </form>

  <div class="config-link">
    <a onclick="toggleConfigSupabase()">⚙️ Configurar URL y Clave de Supabase</a>
  </div>

  <div id="supabaseConfigBox">
    <label style="font-size:11px;">Project URL de Supabase</label>
    <input type="text" id="sbUrl" placeholder="https://tu-proyecto.supabase.co" style="font-size:12px; margin-bottom:8px;">
    <label style="font-size:11px;">Anon Public Key de Supabase</label>
    <input type="password" id="sbKey" placeholder="eyJhbGciOiJIUzI1NiIsIn..." style="font-size:12px; margin-bottom:12px;">
    <button type="button" class="btn" style="padding:8px; font-size:12px; background:#475569;" onclick="guardarCredencialesSupabase()">Guardar Conexión en Navegador</button>
  </div>
</div>

<script>
function seleccionarUsuario(correo) {
  document.getElementById('email').value = correo;
  document.getElementById('password').focus();
}

function toggleConfigSupabase() {
  const box = document.getElementById('supabaseConfigBox');
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
  document.getElementById('sbUrl').value = localStorage.getItem('supabaseUrl') || '';
  document.getElementById('sbKey').value = localStorage.getItem('supabaseKey') || '';
}

function guardarCredencialesSupabase() {
  const url = document.getElementById('sbUrl').value.trim();
  const key = document.getElementById('sbKey').value.trim();
  localStorage.setItem('supabaseUrl', url);
  localStorage.setItem('supabaseKey', key);
  alert('Conexión con Supabase guardada correctamente.');
  document.getElementById('supabaseConfigBox').style.display = 'none';
}

async function iniciarSesion(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  const errorBox = document.getElementById('errorMsg');
  const btn = document.getElementById('btnSubmit');
  errorBox.style.display = 'none';

  // Verificar si hay configuración activa de Supabase
  const sbUrl = localStorage.getItem('supabaseUrl');
  const sbKey = localStorage.getItem('supabaseKey');

  btn.textContent = "Verificando...";
  btn.disabled = true;

  try {
    if (sbUrl && sbKey) {
      // Autenticación real contra Supabase
      const supabase = window.supabase.createClient(sbUrl, sbKey);
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }

    // Regla de roles definida por el usuario:
    // asesorconsultorcasf@yahoo.com -> Administrador
    // csepulvedafuica@gmail.com -> Bar
    if (email === 'asesorconsultorcasf@yahoo.com') {
      sessionStorage.setItem('usuarioEmail', email);
      sessionStorage.setItem('usuarioRol', 'ADMIN');
      sessionStorage.setItem('sesionGerente', 'autorizado');
      window.location.href = 'app_panel_gerencial.html';
    } else if (email === 'csepulvedafuica@gmail.com') {
      sessionStorage.setItem('usuarioEmail', email);
      sessionStorage.setItem('usuarioRol', 'BAR');
      sessionStorage.removeItem('sesionGerente'); // Sin permiso para gerencia
      window.location.href = 'app_operacion_bar.html';
    } else {
      // Para cualquier otro correo, se define por defecto como Bar salvo que sea admin
      sessionStorage.setItem('usuarioEmail', email);
      sessionStorage.setItem('usuarioRol', 'BAR');
      sessionStorage.removeItem('sesionGerente');
      window.location.href = 'app_operacion_bar.html';
    }
  } catch (err) {
    errorBox.textContent = err.message || "Error al autenticar en Supabase. Verifica tus datos.";
    errorBox.style.display = 'block';
    btn.textContent = "Iniciar Sesión →";
    btn.disabled = false;
  }
}
</script>

</body>
</html>
